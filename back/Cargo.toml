[package]
name = "back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
axum-macros = "0.5.0"
bcrypt = "0.17.0"
chrono = "0.4.41"
dotenv = "0.15.0"
jsonwebtoken = "9.3.1"
rand = "0.9.1"
regex = "1.11.1"
serde = "1.0.219"
sqlx = { version="0.8.6", features = ["postgres", "runtime-async-std", "time"] }
time = { version="0.3.41", features = ["serde"] }
tokio = "1.46.1"
tower = "0.5.2"
tower-http = { version="0.6.6", features=["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
