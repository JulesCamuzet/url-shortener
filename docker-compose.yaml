version: '3.8'

services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./back
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
